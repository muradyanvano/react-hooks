name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install package-lock npm
        run: npm install -g npm@11.8.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify (format, types, lint, unit, builds, Storybook tests, SSR)
        run: npm run verify:ci

      - name: Coverage
        run: npm run test:coverage

      - name: Storybook reset audit
        run: npm run test:reset

      - name: Pack dry-run
        run: npm run pack:dry-run

      - name: Release validation
        # Post-build: require dist outputs in the publishable tarball.
        run: node scripts/validate-release.mjs --require-publishable

      - name: Audit production dependencies
        run: npm audit --omit=dev
